<!doctype html>
<html lang="en" class="dark bg-background select-none">
  <head>
    <meta charset="utf-8" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="%sveltekit.assets%/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="%sveltekit.assets%/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" sizes="180x180" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#151515" />
    <meta name="description" content="Collection tracking, tools, and player aids for Kingdom Death: Monster and other board games." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75,700&family=Inter:wght@500;700&display=swap"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-background font-sans antialiased">
    <div>%sveltekit.body%</div>
  </body>
</html>
