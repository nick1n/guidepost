<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body,
      .icon {
        width: 1024px;
        height: 1024px;
        margin: 0;
        /* overflow: hidden; */
      }

      .icon {
        position: relative;
        background: radial-gradient(circle at center, hsl(14 48% 66% / 1) 0%, #39221d 32%, #151515 62%, hsl(14 48% 33% / 1) 100%);
        overflow: hidden;
      }

      .halo {
        position: absolute;
        /* top: 18%; */
        /* left: 14%; */
        /* width: 64%; */
        /* aspect-ratio: 1; */
        inset: 0;
        /* border-radius: 50%; */
        background: radial-gradient(circle at 42% 39%, #e59a4eff 0%, #c66a355c 34%, #873b2429 56%, transparent 74%);
        /* filter: blur(22px); */
      }

      .mark {
        position: absolute;
        top: 50%;
        left: 50%;
        height: 225%;
        translate: -50% -50%;
        rotate: -30deg;
        /* filter: drop-shadow(0 12px 18px #00000099); */
      }
      /*
      .maskable .halo {
        top: 24%;
        left: 22%;
        width: 52%;
      }

      .maskable .mark {
        height: 64%;
      } */
    </style>
  </head>
  <body>
    <div class="icon">
      <div class="halo"></div>
      <svg class="mark" viewBox="0 0 850 1100">
        <image href="/logo/guidepost.svg" width="850" height="1100"></image>
      </svg>
    </div>
    <script>
      if (new URLSearchParams(location.search).has("maskable")) document.body.classList.add("maskable");
    </script>
  </body>
</html>
